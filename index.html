<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배유진 — 아동 발달 연구 · 서비스 디자인 아카이브</title>
<meta name="description" content="아동 발달을 연구하고, 그 근거로 서비스를 디자인하고, 직접 만듭니다. 배유진 프로젝트 아카이브.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://yujin-portfolio-e07ef-default-rtdb.asia-southeast1.firebasedatabase.app">
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"></noscript>
<!-- Pretendard: 동적 서브셋 + 렌더링 비차단 로드 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<noscript><link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<style>
/* ─────────────────────────────────────────────
   TOKENS — 단일 폰트 스택
   라틴/숫자는 Archivo, 한글은 Pretendard가 자동으로 받음
   ───────────────────────────────────────────── */
:root{
  --paper:#FFFFFF;
  --wash:#F0F0F2;
  --ink:#0B0B0E;
  --mute:#86868F;
  --line:#E2E2E6;
  --point:#2323FF;

  --font:"Archivo","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;

  --gut:clamp(20px,5vw,72px);
  --ease:cubic-bezier(.2,.7,.2,1);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.is-locked{overflow:hidden}
button,input,textarea,select{font-family:var(--font)}

a{color:inherit}
:focus-visible{outline:2px solid var(--point);outline-offset:3px;border-radius:2px}
.ov :focus-visible{outline-color:#fff}

/* label 계열: 폰트는 같고 자간·대문자로만 구분 */
.eyebrow{
  font-size:11px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);display:block;
}

/* ─────────────────────────────────────────────
   NAV
   ───────────────────────────────────────────── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px var(--gut);
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  font-size:11px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;
}
.nav__links{display:flex;gap:20px}
.nav a{text-decoration:none;color:var(--mute);transition:color .2s}
.nav a:hover{color:var(--point)}
@media(max-width:900px){.nav__links a:nth-child(2),.nav__links a:nth-child(4){display:none}}
@media(max-width:620px){.nav__links a:nth-child(3){display:none}}

/* ─────────────────────────────────────────────
   HERO
   ───────────────────────────────────────────── */
.hero{
  min-height:100svh;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:120px var(--gut) 40px;
}
.hero__top{margin-bottom:auto;padding-top:6vh}
.hero__name{
  font-weight:800;font-stretch:118%;
  font-size:clamp(2.6rem,9.5vw,8.5rem);
  line-height:.87;letter-spacing:-.035em;
  margin:0;text-transform:uppercase;
}
.hero__kr{
  display:block;font-weight:800;font-stretch:100%;
  font-size:clamp(1rem,2.7vw,1.9rem);
  letter-spacing:-.025em;line-height:1.1;
  margin-bottom:.4em;text-transform:none;
}
.hero__thesis{
  font-size:clamp(1.15rem,3vw,2.05rem);
  font-weight:500;line-height:1.45;letter-spacing:-.025em;
  max-width:24ch;margin:clamp(28px,5vh,56px) 0 0;
}
.axis{
  font:inherit;background:none;border:0;padding:0 .04em;
  color:var(--point);cursor:pointer;position:relative;font-weight:800;
}
.axis::after{
  content:"";position:absolute;left:0;right:0;bottom:.06em;
  height:.09em;background:var(--point);
  transform:scaleX(0);transform-origin:left;
  transition:transform .35s var(--ease);
}
.axis:hover::after,.axis:focus-visible::after{transform:scaleX(1)}

.hero__meta{
  display:flex;flex-wrap:wrap;gap:8px 28px;
  margin-top:clamp(32px,6vh,64px);
  font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--mute);
}
.hero__meta b{color:var(--ink);font-weight:600}

/* ─────────────────────────────────────────────
   SECTION FRAME
   ───────────────────────────────────────────── */
.sec{padding:clamp(72px,11vh,140px) 0}
.sec--tight{padding-top:clamp(40px,6vh,80px)}
.sec__head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:24px;flex-wrap:wrap;padding-inline:var(--gut);
  margin-bottom:clamp(28px,5vh,52px);
}
.sec__title{
  font-weight:700;font-stretch:112%;
  font-size:clamp(1.4rem,3.4vw,2.6rem);
  letter-spacing:-.025em;margin:0;text-transform:uppercase;
}
.sec__count{font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.16em;text-transform:uppercase}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding-inline:var(--gut);margin-bottom:22px}
.chip{
  font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 14px;border-radius:100px;
  border:1px solid var(--line);background:transparent;color:var(--mute);
  cursor:pointer;transition:all .22s var(--ease);
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--point);border-color:var(--point);color:#fff}

/* ─────────────────────────────────────────────
   TRACK
   ───────────────────────────────────────────── */
.track{margin-inline:var(--gut);display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.track__c{background:var(--paper);padding:26px 24px}
.track__h{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--point);margin-bottom:16px}
.track__l{list-style:none;margin:0;padding:0;font-size:14.5px;line-height:1.6}
.track__l li{padding:11px 0;border-bottom:1px dashed var(--line)}
.track__y{display:inline-block;background:var(--wash);color:var(--mute);font-size:10.5px;font-weight:500;letter-spacing:.08em;padding:3px 8px;border-radius:4px;margin-bottom:6px;line-height:1.3}
.track__l li:last-child{border-bottom:0}
.track__l b{font-weight:600}
.track__s{display:block;color:var(--mute);font-size:13px;margin-top:2px}
@media(max-width:760px){.track{grid-template-columns:1fr}}

/* ─────────────────────────────────────────────
   SKILL
   ───────────────────────────────────────────── */
.skleg{display:flex;flex-wrap:wrap;gap:10px 22px;padding-inline:var(--gut);margin:-24px 0 24px}
.skleg__i{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.sk{margin-inline:var(--gut);display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.sk__c{background:var(--paper);padding:24px}
.sk__h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--point);margin-bottom:14px}
.sk__h small{font-size:10px;font-weight:500;color:var(--mute);letter-spacing:.1em}
.sk__l{list-style:none;margin:0;padding:0}
.sk__i{display:grid;grid-template-columns:minmax(0,1fr) auto 50px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.sk__i:last-child{border-bottom:0}
.sk__n{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.sk__s{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:2px;letter-spacing:0}
.sk__y{font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.06em;white-space:nowrap}
.mtr{display:flex;gap:2px;justify-self:end}
.mtr i{width:10px;height:4px;background:var(--line);border-radius:1px;transition:background .3s var(--ease)}
.mtr i.on{background:var(--point)}
@media(max-width:760px){.sk{grid-template-columns:1fr}}

/* ─────────────────────────────────────────────
   ARCHIVE ROWS
   ───────────────────────────────────────────── */
.mx{--ycol:104px;margin-inline:var(--gut);border-top:1px solid var(--line)}
.mx__head{
  display:grid;grid-template-columns:var(--ycol) repeat(3,minmax(0,1fr));
  position:sticky;top:48px;z-index:20;
  background:rgba(255,255,255,.93);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.mx__head span{padding:11px 14px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.mx__head span+span{border-left:1px solid var(--line)}
.mx__head span.on{color:var(--point)}

.mx__yr{
  display:grid;grid-template-columns:var(--ycol) repeat(3,minmax(0,1fr));
  gap:9px 0;padding:18px 0;border-bottom:1px solid var(--line);position:relative;
}
.mx__yr::before{
  content:"";position:absolute;top:0;bottom:0;left:var(--ycol);right:0;pointer-events:none;
  background:linear-gradient(90deg,
    transparent calc(33.333% - .5px),var(--line) calc(33.333% - .5px),
    var(--line) calc(33.333% + .5px),transparent calc(33.333% + .5px),
    transparent calc(66.666% - .5px),var(--line) calc(66.666% - .5px),
    var(--line) calc(66.666% + .5px),transparent calc(66.666% + .5px));
}
.mx__ylab{grid-column:1;grid-row:1/-1;padding:6px 14px 0 0}
.mx__ylab b{display:block;font-weight:800;font-stretch:112%;font-size:clamp(1.15rem,2.8vw,1.8rem);letter-spacing:-.035em;line-height:1}
.mx__ylab small{display:block;font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:6px}

.mx__bar{
  position:relative;z-index:1;margin:0 7px;padding:13px 15px;
  border:1px solid var(--line);border-radius:9px;background:var(--paper);
  text-align:left;color:var(--ink);cursor:pointer;overflow:hidden;
  transition:border-color .25s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease);
}
.mx__bar:hover,.mx__bar:focus-visible{border-color:var(--point);transform:translateY(-2px);box-shadow:0 8px 22px rgba(35,35,255,.11)}
.mx__bar--feat{background:var(--point);border-color:var(--point);color:#fff}
.mx__bar--feat:hover{box-shadow:0 10px 26px rgba(35,35,255,.28)}
.mx__t{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.025em;line-height:1.3}
.mx__t i{font-style:normal;color:var(--point);margin-left:5px}
.mx__bar--feat .mx__t i{color:#fff}
.mx__e{display:block;font-size:11.5px;line-height:1.45;color:var(--mute);margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mx__bar--feat .mx__e{color:rgba(255,255,255,.8)}
.mx__bar[hidden],.mx__yr[hidden]{display:none}

/* ── GALLERY ── */
.gal{margin-inline:var(--gut)}
.gal__g{margin-bottom:clamp(34px,5vh,58px)}
.gal__h{display:flex;align-items:baseline;gap:12px;padding-bottom:11px;margin-bottom:18px;border-bottom:1px solid var(--ink)}
.gal__t{font-size:13px;font-weight:700;letter-spacing:.04em;margin:0}
.gal__n{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.gal__d{font-size:12.5px;color:var(--mute);margin:0 0 16px;line-height:1.55}
.gal__row{position:relative}
.gal__track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
  padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.gal__track::-webkit-scrollbar{height:5px}
.gal__track::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.gal__track::-webkit-scrollbar-track{background:transparent}
.gal__i{flex:0 0 clamp(168px,20vw,224px);scroll-snap-align:start}
.gal__nav{position:absolute;top:calc(50% - 34px);transform:translateY(-50%);z-index:3;
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.94);
  backdrop-filter:blur(6px);color:var(--ink);cursor:pointer;font-size:14px;line-height:1;padding:0;
  box-shadow:0 3px 12px rgba(0,0,0,.09);transition:all .2s var(--ease)}
.gal__nav:hover{border-color:var(--point);color:var(--point)}
.gal__nav[disabled]{opacity:0;pointer-events:none}
.gal__nav--prev{left:-13px}
.gal__nav--next{right:-13px}
@media(max-width:760px){.gal__nav{display:none}}
.gal__i{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper);
  cursor:pointer;padding:0;text-align:left;color:var(--ink);
  transition:border-color .25s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease)}
.gal__i:hover,.gal__i:focus-visible{border-color:var(--point);transform:translateY(-3px);box-shadow:0 9px 24px rgba(35,35,255,.12)}
.gal__th{display:block;width:100%;aspect-ratio:4/3;background:var(--wash);overflow:hidden;position:relative}
.gal__th img{width:100%;height:100%;object-fit:cover;display:block}
.gal__ph{display:flex;align-items:center;justify-content:center;height:100%;
  font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.gal__c{padding:10px 12px;font-size:12.5px;line-height:1.45;font-weight:500;border-top:1px solid var(--line)}
.mxleg{display:flex;flex-wrap:wrap;gap:10px 22px;padding-inline:var(--gut);margin:-6px 0 22px;
  font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--mute)}
.mxleg__i{display:flex;align-items:center;gap:7px}
.mxleg__s{width:22px;height:11px;border-radius:4px;border:1px solid var(--line);background:var(--paper)}
.mxleg__s--feat{background:var(--point);border-color:var(--point)}

@media(max-width:760px){
  .mx{--ycol:46px}
  .mx__head span{padding:9px 7px;font-size:9px;letter-spacing:.1em}
  .mx__yr{padding:13px 0;gap:7px 0}
  .mx__ylab{padding-right:7px}
  .mx__ylab small{display:none}
  .mx__bar{margin:0 3px;padding:9px 9px;border-radius:7px}
  .mx__t{font-size:11.5px;letter-spacing:-.03em}
  .mx__e{display:none}
}

/* ─────────────────────────────────────────────
   OVERLAY
   ───────────────────────────────────────────── */
.ov{
  position:fixed;inset:0;z-index:60;
  background:var(--point);color:#fff;
  overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(100%);
  transition:transform .62s var(--ease);
  visibility:hidden;
}
.ov.is-open{transform:translateY(0);visibility:visible}
.ov__bar{
  position:sticky;top:0;z-index:2;
  display:flex;justify-content:space-between;align-items:center;
  padding:16px var(--gut);background:var(--point);
  border-bottom:1px solid rgba(255,255,255,.22);
  font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
}
.ov__close{
  font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  background:none;border:1px solid rgba(255,255,255,.45);
  color:#fff;padding:6px 14px;border-radius:100px;cursor:pointer;
  transition:background .2s,color .2s;
}
.ov__close:hover{background:#fff;color:var(--point)}
.ov__body{padding:clamp(40px,8vh,96px) var(--gut) clamp(80px,14vh,160px);max-width:1180px}
.ov__title{font-size:clamp(1.7rem,4vw,3.1rem);font-weight:800;letter-spacing:-.035em;line-height:1.12;margin:14px 0 0;max-width:20ch;white-space:pre-wrap}
.ov__title--pub{font-size:clamp(1.5rem,3.4vw,2.65rem);line-height:1.2;max-width:24ch;letter-spacing:-.032em}
.ov__ten{font-size:clamp(.95rem,1.5vw,1.15rem);font-weight:500;line-height:1.45;letter-spacing:-.01em;color:rgba(255,255,255,.72);margin:12px 0 0;max-width:44ch;white-space:pre-wrap}
.ov__role{font-size:11.5px;font-weight:500;letter-spacing:.14em;color:rgba(255,255,255,.72);text-transform:uppercase;margin-top:18px}
.ov__lead{white-space:pre-wrap;font-size:clamp(1.05rem,2.2vw,1.5rem);font-weight:500;line-height:1.55;letter-spacing:-.02em;max-width:34ch;margin:clamp(24px,4vh,44px) 0 0}

.ev{display:flex;flex-wrap:wrap;gap:1px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.28);margin:clamp(36px,6vh,64px) 0}
.ev__i{flex:1 1 130px;background:var(--point);padding:18px 20px}
.ev__v{font-weight:700;font-stretch:112%;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1;letter-spacing:-.035em}
.ev__l{font-size:10.5px;font-weight:500;letter-spacing:.12em;color:rgba(255,255,255,.75);margin-top:9px;text-transform:uppercase}

.case{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;padding:26px 0;border-top:1px solid rgba(255,255,255,.26)}
.case:last-of-type{border-bottom:1px solid rgba(255,255,255,.26)}
.case__k{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);padding-top:4px}
.case__v{white-space:pre-wrap;font-size:clamp(.96rem,1.5vw,1.05rem);line-height:1.68;max-width:38em;margin:0}
@media(max-width:720px){.case{grid-template-columns:1fr;gap:8px}}

.ov__links{display:flex;gap:10px;flex-wrap:wrap;margin-top:36px}
.ov__link{
  font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.45);border-radius:100px;padding:9px 16px;
  text-decoration:none;transition:background .2s,color .2s;
}
.ov__link:hover{background:#fff;color:var(--point)}

/* ─────────────────────────────────────────────
   PUBLICATIONS
   ───────────────────────────────────────────── */
.pubs{border-top:1px solid var(--line)}
.pub{
  display:grid;grid-template-columns:96px minmax(0,1fr) auto 28px;gap:20px;
  width:100%;padding:20px var(--gut);border-bottom:1px solid var(--line);
  align-items:baseline;background:none;border-left:0;border-right:0;border-top:0;
  text-align:left;color:var(--ink);cursor:pointer;position:relative;
  transition:background .28s var(--ease),padding-left .3s var(--ease);
}
.pub::before{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:0;background:var(--point);transition:width .3s var(--ease)}
.pub:hover,.pub:focus-visible{background:var(--wash);padding-left:calc(var(--gut) + 12px)}
.pub:hover::before,.pub:focus-visible::before{width:4px}
.pub__go{font-size:15px;color:var(--line);justify-self:end;transition:color .25s,transform .3s var(--ease)}
.pub:hover .pub__go{color:var(--point);transform:translate(3px,-3px)}
.pub__m{color:var(--point);font-weight:600}
.pub__y{font-size:12px;font-weight:500;color:var(--mute);letter-spacing:.04em}
.pub__t{font-size:15.5px;line-height:1.55;font-weight:500}
.pub__s{display:block;font-size:13.5px;color:var(--mute);font-weight:400;margin-top:4px}
.pub__type{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  color:#5a5a63;background:var(--wash);border-radius:5px;padding:3px 8px;margin-right:9px;
  vertical-align:2px;white-space:nowrap;transition:background .25s var(--ease),color .25s var(--ease)}
.pub:hover .pub__type{background:#e6e6ea;color:var(--ink)}

.pub__r{justify-self:end;display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.pub__st,.pub__aw{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.05em;
  white-space:nowrap;padding:4px 11px;border-radius:100px;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .25s var(--ease)}

.adm__foot{padding:12px 20px;border-top:1px solid var(--line);flex-shrink:0;font-size:11px;color:var(--mute);line-height:1.5}

.gate__box input:focus{outline:none;border-color:var(--point)}

/* ─────────────────────────────────────────────
   MOTION
   ───────────────────────────────────────────── */
.rise{opacity:0;transform:translateY(20px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rise.in{opacity:1;transform:none}

/* 부팅 커버 — DB 응답 전 옛 데이터가 스치는 것을 방지 */
.boot{
  position:fixed;inset:0;z-index:120;background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .38s var(--ease);
}
.boot.is-done{opacity:0;pointer-events:none}
.boot__b{width:34px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.boot__b::after{
  content:"";display:block;width:40%;height:100%;background:var(--point);
  animation:bootslide 1s var(--ease) infinite;
}
@keyframes bootslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .rise{opacity:1;transform:none}
}

/* ── 미디어 URL 정규화: Drive / Docs / YouTube 자동 변환 ── */
function mediaSrc(m){
  const u = String(m.u || "").trim();
  if(!u) return "";
  let x;
  // Google Drive 파일
  if((x = u.match(/drive\.google\.com\/file\/d\/([\w-]{20,})/) || u.match(/drive\.google\.com\/[^]*[?&]id=([\w-]{20,})/))){
    return m.t === "image"
      ? `https://drive.google.com/thumbnail?id=${x[1]}&sz=w1600`
      : `https://drive.google.com/file/d/${x[1]}/preview`;
  }
  // Google Docs / Slides / Sheets
  if((x = u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]{20,})/))){
    return `https://docs.google.com/${x[1]}/d/${x[2]}/preview`;
  }
  // YouTube
  if((x = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/))){
    return `https://www.youtube.com/embed/${x[1]}`;
  }
  return u;
}

let DATA = JSON.parse(document.getElementById("site-data").textContent);

const $   = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bold = s => esc(s).replace(/\*([^*]+)\*/g,"<b>$1</b>");

const MKIND = { image:"사진", pdf:"PDF", embed:"영상", link:"링크" };
function mediaKinds(list){
  const seen = [];
  (list||[]).forEach(m=>{ const k = MKIND[m.t] || "자료"; if(!seen.includes(k)) seen.push(k); });
  return seen.join(" · ");
}

const RATIOS = { a4:"1/1.414", wide:"16/9", four3:"4/3", square:"1/1", tall:"3/4" };

function renderMedia(list){
  if(!list || !list.length) return "";
  const items = list.map(m=>{
    const src = mediaSrc(m);
    if(!src) return "";
    if(m.t === "link")
      return `<a class="ov__link" href="${esc(src)}" target="_blank" rel="noopener">${esc(m.c || "자료 열기")} ↗</a>`;

    const full = (m.w || (m.t === "image" ? "half" : "full")) === "full";
    // 비율은 항목별 설정을 따르고, 없으면 영상은 16:9, 그 외는 4:3
    const ar = RATIOS[m.r] || (m.t === "embed" ? RATIOS.wide : RATIOS.four3);
    const frame = m.t === "image"
      ? `<span class="md__f" style="--ar:${ar}"><img src="${esc(src)}" alt="${esc(m.c||"")}" loading="lazy"
           onerror="this.closest('.md__f').innerHTML='<span class=&quot;md__err&quot;>이미지를 불러오지 못했습니다.<br>공유 설정이 공개인지 확인해 주세요.</span>'"></span>`
      : `<span class="md__f" style="--ar:${ar}"><iframe src="${esc(src)}" loading="lazy" allowfullscreen title="${esc(m.c||"첨부 자료")}"></iframe></span>`;

    return `<div class="md__i${full?" md__i--full":""}">${frame}
      <div class="md__c"><span>${esc(m.c||"")}</span>
        <a class="md__o" href="${esc(m.u)}" target="_blank" rel="noopener">원본 ↗</a></div>
    </div>`;
  }).filter(Boolean);

  const links = items.filter(x=>x.startsWith("<a"));
  const cards = items.filter(x=>!x.startsWith("<a"));
  return (cards.length ? `<div class="md">${cards.join("")}</div>` : "")
       + (links.length ? `<div class="ov__links">${links.join("")}</div>` : "");
}

/* 열려 있는 레이어를 브라우저 히스토리에 등록해, 뒤로가기로 닫히게 함 */
let histDepth = 0;
function pushLayer(){ histDepth++; history.pushState({ layer: histDepth }, ""); }
function popLayer(){ if(histDepth > 0){ histDepth--; history.back(); } }

let galPos = null;   // 현재 보고 있는 갤러리 위치

function openGal(gi, ii){
  const g = DATA.gallery?.groups?.[gi]; const it = g?.items?.[ii];
  if(!it) return;
  const first = galPos === null;
  galPos = { gi, ii };
  if(first) lastFocus = document.activeElement;

  $("#ov-idx").textContent = `${g.h} — ${ii+1} / ${g.items.length}`;
  $("#ov-body").innerHTML = `
    <span class="eyebrow" style="color:rgba(255,255,255,.7)">${esc(g.h)}</span>
    <h2 class="ov__title ov__title--pub" id="ov-title">${esc(it.c || g.h)}</h2>
    ${it.note?`<p class="ov__ten">${esc(it.note)}</p>`:""}
    <div class="ov__sec">
      <span class="ov__lab">작업물</span>
      ${renderMedia([{ ...it, c: "", w: "full" }])}
    </div>
    ${g.items.length > 1 ? `<div class="galnav">
      <button class="galnav__b" data-step="-1" ${ii===0?"disabled":""}>‹ 이전</button>
      <span class="galnav__c">${ii+1} / ${g.items.length}</span>
      <button class="galnav__b" data-step="1" ${ii===g.items.length-1?"disabled":""}>다음 ›</button>
    </div>` : ""}`;

  $("#ov-body").querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{
    openGal(gi, ii + Number(b.dataset.step));
  });

  const wasOpen = ov.classList.contains("is-open");
  ov.classList.add("is-open"); ov.setAttribute("aria-hidden","false");
  document.body.classList.add("is-locked");
  if(first){ ov.scrollTop = 0; $("#ov-close").focus(); pushLayer(); }
}

function closeCase(fromPop){
  galPos = null;
  ov.classList.remove("is-open"); ov.setAttribute("aria-hidden","true");
  document.body.classList.remove("is-locked");
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
  if(fromPop){ histDepth = Math.max(0, histDepth - 1); } else { popLayer(); }
}

function closeAdmin(fromPop){
  adm.classList.remove("is-open"); adm.setAttribute("aria-hidden","true");
  if(fromPop){ histDepth = Math.max(0, histDepth - 1); } else { popLayer(); }
}

window.addEventListener("popstate", ()=>{
  if(ov.classList.contains("is-open")) closeCase(true);
  else if(adm.classList.contains("is-open")) closeAdmin(true);
  else if(gate.classList.contains("is-open")) gate.classList.remove("is-open");
});
function bindSite(){
  document.querySelectorAll(".mx__bar").forEach(r=>r.onclick=()=>openCase(r.dataset.id));
  document.querySelectorAll(".pub").forEach(r=>r.onclick=()=>openPub(r.dataset.pub));
  document.querySelectorAll(".gal__i").forEach(r=>r.onclick=()=>{
    const [gi,ii] = r.dataset.gal.split(":").map(Number); openGal(gi,ii);
  });
  document.querySelectorAll(".gal__row").forEach(row=>{
    const track = row.querySelector(".gal__track");
    const prev = row.querySelector(".gal__nav--prev");
    const next = row.querySelector(".gal__nav--next");
    const step = () => track.clientWidth * 0.8;
    prev.onclick = ()=>track.scrollBy({ left: -step(), behavior: "smooth" });
    next.onclick = ()=>track.scrollBy({ left:  step(), behavior: "smooth" });
    const sync = ()=>{
      const max = track.scrollWidth - track.clientWidth;
      prev.disabled = track.scrollLeft < 8;
      next.disabled = track.scrollLeft > max - 8;
    };
    track.addEventListener("scroll", sync, { passive: true });
    sync();
  });
  document.querySelectorAll(".axis").forEach(b=>b.onclick=()=>{
    applyFilter(b.dataset.axis);
    $("#archive").scrollIntoView({behavior:"smooth",block:"start"});
  });
}
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>applyFilter(c.dataset.f));

async function fbLogin(){

/* field helpers — path 기반 양방향 바인딩 */
function getPath(p){ return p.split(".").reduce((o,k)=>o?.[/^\d+$/.test(k)?+k:k], DATA); }
function setPath(p,v){
  const parts = p.split(".");
  const last = parts.pop();
  const tgt = parts.reduce((o,k)=>o[/^\d+$/.test(k)?+k:k], DATA);
  tgt[/^\d+$/.test(last)?+last:last] = v;
}
function F(label, path, {area=false, hint=""}={}){
  const v = esc(getPath(path));
  const el = area
    ? `<textarea data-p="${path}">${v}</textarea>`
    : `<input type="text" data-p="${path}" value="${v}">`;
  return `<div class="fld"><label>${label}</label>${el}${hint?`<p class="hint">${hint}</p>`:""}</div>`;
}

/* 순서 변경 컨트롤 — 드래그 핸들 + ▲▼ (터치·키보드 대체 수단) */
function SORTBAR(path, i, len){
  if(len < 2) return "";
  return `<span class="sort">
    <span class="sort__g" draggable="true" data-sp="${path}" data-si="${i}" title="드래그해서 순서 변경" aria-hidden="true">⠿</span>
    <button class="sort__b" data-mv="${path}:${i}:-1" ${i===0?"disabled":""} title="위로" aria-label="위로">▲</button>
    <button class="sort__b" data-mv="${path}:${i}:1" ${i===len-1?"disabled":""} title="아래로" aria-label="아래로">▼</button>
  </span>`;
}

function moveItem(path, from, to){
  const arr = getPath(path);
  if(!Array.isArray(arr)) return false;
  if(to < 0 || to >= arr.length || from === to) return false;
  arr.splice(to, 0, arr.splice(from, 1)[0]);
  return true;
}

function SEL(label, path, opts, num){
  const v = String(getPath(path) ?? "");
  return `<div class="fld"><label>${label}</label><select data-p="${path}"${num?' data-num="1"':""}>${
    opts.map(o=>`<option value="${o[0]}" ${String(o[0])===v?"selected":""}>${o[1]}</option>`).join("")
  }</select></div>`;
}

$("#adm-body").addEventListener("click", e=>{
  const tg = e.target.closest("[data-toggle]");
  if(tg){ tg.closest(".card")?.classList.toggle("is-open"); return; }

  const bulk = e.target.closest("[data-bulkgo]")?.dataset.bulkgo;
  if(bulk !== undefined){
    const ta = $(`textarea[data-bulk="${bulk}"]`);
    const lines = (ta?.value || "").split("\n").map(s=>s.trim()).filter(Boolean);
    if(!lines.length){ alert("추가할 파일명이나 주소를 붙여넣어 주세요."); return; }

    const base = ($("#gal-base")?.value || "").trim();
    DATA.gallery.base = base;
    const gi = +bulk;

    lines.forEach(raw=>{
      const u = /^(https?:)?\/\//.test(raw) ? raw : (base + raw.replace(/^\/+/, ""));
      const low = u.toLowerCase();
      const isVid = /youtube\.com|youtu\.be|\.(mp4|mov|webm)(\?|$)/.test(low);
      const isPdf = /\.pdf(\?|$)/.test(low);
      const name = decodeURIComponent(raw.split(/[?#]/)[0].split("/").pop() || "").replace(/\.[^.]+$/, "");
      DATA.gallery.groups[gi].items.push({
        t: isVid ? "embed" : (isPdf ? "pdf" : "image"),
        u, c: name, note: "", w: "full", r: isVid ? "wide" : "four3"
      });
    });
    ta.value = "";
    renderSite(); renderAdmin();
    alert(`${lines.length}개 항목을 추가했습니다. 저장 버튼을 눌러 반영하세요.`);
    return;
  }

  const add = e.target.closest("[data-add]")?.dataset.add;
  if(add){
    const [k,i] = add.split(":");
    if(k==="meta") DATA.site.meta.push("새 항목");

    if(k==="skitem") DATA.skills.groups[+i].items.push({n:"도구",d:"설명",y:"1년",l:2});
    if(k==="proj") DATA.projects.unshift({id:"new"+Date.now(),year:"2026",live:false,feat:false,title:"새 프로젝트",en:"New project",desc:"한 줄 설명",tags:["디자인"],role:"역할",lead:"리드 문장",ev:[{v:"—",l:"라벨"}],blocks:[{k:"문제",v:""},{k:"접근 · 근거",v:""},{k:"만든 것",v:""},{k:"결과",v:""}],links:[]});
    if(k==="ev") DATA.projects[+i].ev.push({v:"—",l:"라벨"});
    if(k==="blk") DATA.projects[+i].blocks.push({k:"항목",v:""});
    if(k==="lnk") DATA.projects[+i].links.push({label:"링크",url:"https://"});
    if(k==="pmed") (DATA.projects[+i].media = DATA.projects[+i].media||[]).push({t:"image",u:"",c:"",w:"half",r:"a4"});
    if(k==="bmed") (DATA.pubs[+i].media = DATA.pubs[+i].media||[]).push({t:"image",u:"",c:"",w:"half",r:"a4"});
    if(k==="blnk") (DATA.pubs[+i].links = DATA.pubs[+i].links||[]).push({label:"링크",url:"https://"});
    if(k==="pub") DATA.pubs.unshift({id:"pub"+Date.now(),y:"2026",t:"제목",tEn:"",s:"게재처",k:"",type:"",award:"",authors:"",venue:"",abstract:"",media:[],links:[]});
    if(k==="flink") DATA.foot.links.push({label:"Link",url:"https://"});

    if(k==="skgroup") DATA.skills.groups.splice(+a,1);

/* ── 드래그 앤 드롭 정렬 ── */
let dragSrc = null;
const admBody = $("#adm-body");

admBody.addEventListener("dragstart", e=>{
  const g = e.target.closest("[data-sp][draggable]");
  if(!g) return;
  dragSrc = { path: g.dataset.sp, i: +g.dataset.si };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", "");
  const host = g.closest("[data-sp][data-si]:not([draggable])");
  if(host) host.classList.add("is-dragging");
});

admBody.addEventListener("dragover", e=>{
  if(!dragSrc) return;
  const t = e.target.closest(`[data-sp="${CSS.escape(dragSrc.path)}"][data-si]:not([draggable])`);
  if(!t) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  clearMarks();
  const r = t.getBoundingClientRect();
  t.classList.add(e.clientY < r.top + r.height/2 ? "drop-mark" : "drop-mark-after");
});

admBody.addEventListener("drop", e=>{
  if(!dragSrc) return;
  const t = e.target.closest(`[data-sp="${CSS.escape(dragSrc.path)}"][data-si]:not([draggable])`);
  clearMarks();
  if(!t){ dragSrc = null; return; }
  e.preventDefault();
  const r = t.getBoundingClientRect();
  let to = +t.dataset.si + (e.clientY < r.top + r.height/2 ? 0 : 1);
  if(to > dragSrc.i) to--;
  const moved = moveItem(dragSrc.path, dragSrc.i, to);
  dragSrc = null;
  if(moved){ renderSite(); renderAdmin(); }
});

admBody.addEventListener("dragend", ()=>{ clearMarks(); dragSrc = null; });

function clearMarks(){
  admBody.querySelectorAll(".drop-mark,.drop-mark-after,.is-dragging")
    .forEach(el=>el.classList.remove("drop-mark","drop-mark-after","is-dragging"));
}

/* ═══════════ FIREBASE LAYER (Realtime Database) ═══════════ */
let fb = null;

/* RTDB는 빈 배열·빈 객체를 저장하지 않고 삭제합니다.
   불러온 뒤 누락된 필드를 반드시 되살려야 렌더링이 깨지지 않습니다. */
function normalizeData(d){
  const A = v => Array.isArray(v) ? v : [];
  const S = v => (typeof v === "string" ? v : "");
  d = d || {};
  d.site = d.site || {};
  d.site.meta = A(d.site.meta);
  d.site.eyebrow = S(d.site.eyebrow);
  d.site.nameKr = S(d.site.nameKr);
  d.site.nameEn = S(d.site.nameEn);
  d.site.thesis = S(d.site.thesis);

  d.track = A(d.track).map(c => ({ h: S(c.h), items: A(c.items).map(i => ({ y: S(i.y), t: S(i.t), s: S(i.s) })) }));

  d.skills = d.skills || {};
  d.skills.legend = A(d.skills.legend);
  if(d.skills.legend.length !== 4) d.skills.legend = ["입문","활용","능숙","전문"];
  d.skills.groups = A(d.skills.groups).map(g => ({
    h: S(g.h),
    items: A(g.items).map(i => ({ n: S(i.n), d: S(i.d), y: S(i.y), l: Number(i.l) || 1 }))
  }));

  const MED = m => A(m).map(x => ({ t: S(x.t) || "image", u: S(x.u), c: S(x.c),
    w: S(x.w) || (S(x.t) === "image" ? "half" : "full"),
    r: S(x.r) || (S(x.t) === "embed" ? "wide" : "four3") }));
  const LNK = l => A(l).map(x => ({ label: S(x.label), url: S(x.url) }));

  d.projects = A(d.projects).map(p => ({
    id: S(p.id), year: S(p.year), title: S(p.title), en: S(p.en), desc: S(p.desc),
    role: S(p.role), lead: S(p.lead),
    live: !!p.live, feat: !!p.feat,
    tags: A(p.tags),
    ev: A(p.ev).map(e => ({ v: S(e.v), l: S(e.l) })),
    blocks: A(p.blocks).map(b => ({ k: S(b.k), v: S(b.v) })),
    links: LNK(p.links), media: MED(p.media)
  }));

  d.pubs = A(d.pubs).map((p, i) => ({
    id: S(p.id) || "pub" + (i + 1), y: S(p.y), t: S(p.t), tEn: S(p.tEn), s: S(p.s), k: S(p.k),
    type: S(p.type), award: S(p.award),
    authors: S(p.authors), venue: S(p.venue), abstract: S(p.abstract),
    links: LNK(p.links), media: MED(p.media)
  }));

  d.gallery = d.gallery || { groups: [] };
  d.gallery.base = S(d.gallery.base) || "images/";
  d.gallery.groups = A(d.gallery.groups).map(g => ({
    h: S(g.h), d: S(g.d),
    items: A(g.items).map(x => ({ t: S(x.t) || "image", u: S(x.u), c: S(x.c), note: S(x.note),
      w: "full", r: S(x.r) || (S(x.t) === "embed" ? "wide" : "a4") }))
  }));

  d.foot = d.foot || {};
  d.foot.big = S(d.foot.big);
  d.foot.note = S(d.foot.note);
  d.foot.links = LNK(d.foot.links);
  return d;
}

/* 방문자에게 필요한 최소 모듈(app+database)만 먼저 불러옵니다.
   auth·storage는 관리자가 로그인할 때 처음 불러옵니다. */
const FB_SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
let fbCore = null, fbAdmin = null;

async function getCore(){
  if(!FB_ON) return null;
  if(fbCore) return fbCore;
  const [appMod, rt] = await Promise.all([
    import(FB_SDK + "firebase-app.js"),
    import(FB_SDK + "firebase-database.js")
  ]);
  const app = appMod.initializeApp(FB_CONFIG);
  fbCore = { app, rt, db: rt.getDatabase(app) };
  return fbCore;
}

async function getAdmin(){
  if(fbAdmin) return fbAdmin;
  const c = await getCore();
  if(!c) return null;
  const [au, st] = await Promise.all([
    import(FB_SDK + "firebase-auth.js"),
    import(FB_SDK + "firebase-storage.js")
  ]);
  const auth = au.getAuth(c.app);
  // 브라우저를 닫았다 열어도 로그인이 유지되도록 로컬 저장소 방식으로 고정
  try{ await au.setPersistence(auth, au.browserLocalPersistence); }catch(e){ console.warn(e); }

  fbAdmin = { au, st, auth, store: st.getStorage(c.app), user: null };
  // 첫 인증 상태가 확정될 때까지 기다릴 수 있는 약속
  fbAdmin.ready = new Promise(res=>{
    const un = au.onAuthStateChanged(auth, u => { fbAdmin.user = u; syncSaveBtn(); un(); res(u); });
  });
  au.onAuthStateChanged(auth, u => { fbAdmin.user = u; syncSaveBtn(); });
  return fbAdmin;
}

async function fbLogout(){
  const a = await getAdmin();
  if(a?.auth) await a.au.signOut(a.auth);
  syncSaveBtn();
}

async function fbLoad(){
  try{
    const c = await getCore(); if(!c) return false;
    const snap = await c.rt.get(c.rt.ref(c.db, "site/content"));
    if(snap.exists()){ DATA = normalizeData(snap.val()); renderSite(); return true; }
    console.info("DB가 비어 있습니다. 내장 데이터를 표시하고, 저장 시 업로드됩니다.");
  }catch(e){ console.warn("DB 로드 실패 — 내장 데이터로 표시합니다.", e); }
  return false;
}

async function fbSave(){
  const a = await getAdmin();
  if(!a?.user) return alert("먼저 로그인해 주세요.");
  const c = await getCore();
  const b = $("#adm-save"); const t0 = b.textContent;
  b.textContent = "저장 중…"; b.disabled = true;
  try{
    await c.rt.set(c.rt.ref(c.db, "site/content"), JSON.parse(JSON.stringify(normalizeData(DATA))));
    b.textContent = "저장됨 ✓";
    setTimeout(()=>{ b.textContent = "저장"; b.disabled = false; }, 1600);
  }catch(e){
    console.error(e); alert("저장에 실패했습니다: " + e.message);
    b.textContent = t0; b.disabled = false;
  }
}

async function fbUpload(file){
  const a = await getAdmin();
  if(!a?.user){ alert("먼저 로그인해 주세요."); return null; }
  if(file.size > 20 * 1024 * 1024){ alert("20MB 이하 파일만 올릴 수 있습니다."); return null; }
  // Storage가 활성화되지 않은 프로젝트에서는 요청이 무응답으로 지연되므로 15초에서 끊음
  const guard = new Promise((_, rej)=>setTimeout(
    ()=>rej(new Error("업로드가 응답하지 않습니다. Firebase Storage가 활성화되어 있는지(Blaze 요금제 필요) 확인해 주세요.")), 15000));
  const safe = file.name.replace(/[^\w.\-]/g, "_");
  const ref = a.st.ref(a.store, `media/${Date.now()}_${safe}`);
  await Promise.race([a.st.uploadBytes(ref, file), guard]);
  return await a.st.getDownloadURL(ref);
}

function syncSaveBtn(){
  const b = $("#adm-save"); if(!b) return;
  b.hidden = !FB_ON;
  b.textContent = fbAdmin?.user ? "저장" : "로그인 필요";

  const f = $("#adm-foot"); if(!f) return;
  if(fbAdmin?.user){
    f.innerHTML = `<b>${esc(fbAdmin.user.email||"")}</b> 로그인됨 ·
      <button class="btn btn--sm" id="uid-copy">UID 복사</button>
      <button class="btn btn--sm" id="uid-out">로그아웃</button>
      <span style="display:block;margin-top:6px;font-size:10.5px;word-break:break-all;opacity:.75">${esc(fbAdmin.user.uid)}</span>`;
    $("#uid-out").onclick = async ()=>{ await fbLogout(); closeAdmin(); };
    $("#uid-copy").onclick = async ()=>{
      try{ await navigator.clipboard.writeText(fbAdmin.user.uid); $("#uid-copy").textContent = "복사됨 ✓"; }
      catch{ $("#uid-copy").textContent = "아래 값을 직접 복사하세요"; }
    };
  } else {
    f.textContent = FB_ON ? "로그인하면 저장 버튼이 활성화됩니다."
      : "수정은 즉시 반영됩니다. 영구 저장은 HTML 내보내기로 파일을 받아 재배포하세요.";
  }
}

/* 파일 업로드 (미디어 편집 블록) */
$("#adm-body").addEventListener("change", async e=>{
  const inp = e.target;

  // 갤러리 다중 업로드
  if(inp.dataset.multi !== undefined && inp.files?.length){
    const gi = +inp.dataset.multi;
    const files = [...inp.files];
    const lbl = inp.closest("label");
    const orig0 = lbl.firstChild.nodeValue;
    let done = 0, failed = 0;
    for(const f of files){
      lbl.firstChild.nodeValue = `올리는 중 ${done+1}/${files.length} `;
      try{
        const url = await fbUpload(f);
        if(url){
          DATA.gallery.groups[gi].items.push({
            t: f.type.startsWith("video/") ? "embed" : (f.type === "application/pdf" ? "pdf" : "image"),
            u: url, c: f.name.replace(/\.[^.]+$/, ""), note: "", w: "full",
            r: f.type.startsWith("video/") ? "wide" : "four3"
          });
          done++;
        } else failed++;
      }catch(err){ console.error(err); failed++; }
    }
    lbl.firstChild.nodeValue = orig0;
    inp.value = "";
    renderSite(); renderAdmin();
    if(failed) alert(`${done}개 등록, ${failed}개 실패했습니다.`);
    return;
  }

  if(!inp.dataset.up || !inp.files?.length) return;
  const lbl = inp.closest("label"); const orig = lbl.firstChild.nodeValue;
  lbl.firstChild.nodeValue = "업로드 중… ";
  try{
    const url = await fbUpload(inp.files[0]);
    if(url){ setPath(inp.dataset.up, url); renderSite(); renderAdmin(); }
  }catch(err){ console.error(err); alert("업로드 실패: " + err.message); }
  finally{ if(lbl.firstChild) lbl.firstChild.nodeValue = orig; }
});

/* export */
function dl(name, text, type){
  const b = new Blob([text],{type});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u), 1500);
}
$("#adm-json").onclick = ()=>dl("portfolio-data.json", JSON.stringify(DATA,null,2), "application/json");
$("#adm-export").onclick = ()=>{
  const c = document.documentElement.cloneNode(true);
  c.querySelector("#site-data").textContent = "\n" + JSON.stringify(DATA,null,2) + "\n";
  ["#m-eyebrow","#m-name","#m-thesis","#m-meta","#m-track","#m-skleg","#m-skill","#m-gallery","#m-galcount","#m-archive","#m-pubs","#m-footlinks","#m-footbig","#m-footnote","#ov-body","#ov-idx","#adm-body","#gate-err"]
    .forEach(s=>{ const el=c.querySelector(s); if(el) el.innerHTML=""; });
  c.querySelector("#ov").classList.remove("is-open");
  c.querySelector("#ov").setAttribute("aria-hidden","true");
  c.querySelector("#adm").classList.remove("is-open");
  c.querySelector("#adm").setAttribute("aria-hidden","true");
  c.querySelector("#gate").classList.remove("is-open");
  c.querySelector("#gate-box").innerHTML = GATE_HTML;
  const bt = c.querySelector("#boot");
  if(bt){ bt.classList.remove("is-done"); bt.removeAttribute("style"); }
  c.querySelector("body").className = "";
  c.querySelectorAll(".rise").forEach(el=>el.classList.remove("in"));
  dl("index.html", "<!DOCTYPE html>\n<html lang=\"ko\">" + c.innerHTML + "</html>", "text/html");
};

/* global keys */
document.addEventListener("keydown", e=>{
  if(galPos && ov.classList.contains("is-open") && (e.key==="ArrowLeft" || e.key==="ArrowRight")){
    const g = DATA.gallery.groups[galPos.gi];
    const next = galPos.ii + (e.key==="ArrowRight" ? 1 : -1);
    if(next >= 0 && next < g.items.length){ e.preventDefault(); openGal(galPos.gi, next); }
    return;
  }
  if(e.key==="Escape"){
    if(ov.classList.contains("is-open")) closeCase();
    else if(gate.classList.contains("is-open")) gate.classList.remove("is-open");
    else if(adm.classList.contains("is-open")) closeAdmin();
  }
});
if(location.hash === "#admin") setTimeout(askPw, 400);

/* boot */
const GATE_HTML = $("#gate-box").innerHTML;
$("#adm-save").onclick = fbSave;

function bootDone(){
  const b = $("#boot");
  if(!b || b.classList.contains("is-done")) return;
  b.classList.add("is-done");
  setTimeout(()=>{ b.style.display = "none"; }, 420);
}

function withTimeout(promise, ms){
  return Promise.race([promise, new Promise(r=>setTimeout(()=>r("timeout"), ms))]);
}

(async function boot(){
  DATA = normalizeData(DATA);

  if(FB_ON){
    // DB 응답을 기다렸다가 한 번만 그린다. 실패·지연 시 내장 데이터로 폴백.
    let res;
    try{ res = await withTimeout(fbLoad(), 2500); }
    catch(e){ console.warn(e); }
    if(res !== true) renderSite();   // fbLoad는 성공 시 스스로 렌더링함
  } else {
    renderSite();
  }

  syncSaveBtn();
  bootDone();

  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("in"); });
  },{threshold:.12});
  document.querySelectorAll(".rise").forEach(el=>io.observe(el));
})();

/* 스크립트가 어떤 이유로든 멈춰도 화면이 잠기지 않게 하는 안전장치 */
setTimeout(bootDone, 5000);
</script>
